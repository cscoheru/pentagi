# SearXNG limiter config (intel-platform fork hardening)
# Goal: disable bot detection / rate limiting for internal docker-network
# callers (PentAGI). SearXNG defaults to blocking requests missing
# X-Forwarded-For headers from non-whitelisted IPs.

[botdetection]
# 0 = unlimited (disable per-IP cap, since PentAGI is the sole caller)
ip_limit = 0
# Don't require link tokens (used for human browser sessions, not API)
link_token = false
# Trust common proxy headers if a reverse proxy is added later
real_ip_header = "X-Forwarded-For"

[real_ip]
# Trust private network ranges (RFC 1918 + link-local) as proxy sources
real_ip_sources = "172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16, 127.0.0.0/8, ::1"

[ratelimit]
# Disabled — PentAGI is sole internal caller, no need
enable = false
